plugins {
	id 'com.gradleup.shadow' version '8.3.6'
}

architectury {
    platformSetupLoomIde()
    forge()
}

// The preview harness is compiled only for its development run, never into the mod artifact.
sourceSets {
    dev {
        java.srcDir project(":common").file("src/dev/java")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    forge {
        mixinConfig "saomenu.mixins.json"
    }
    runs {
        client {
            client()
            name "Forge Client"
            // Preview creates and removes its own fixture world; never use the normal client directory.
            def configuredRunDir = project.rootProject.findProperty('saomenu.runDir')
            runDir(configuredRunDir == null
                    ? (project.rootProject.hasProperty('saomenu.preview') ? "run/preview" : "run/client")
                    : project.relativePath(project.rootProject.file(configuredRunDir)))
            vmArgs "-Dneoforge.enabledGameTestNamespace=saomenu"
            programArgs "--username", "${project.rootProject.properties.getOrDefault('minecraft_username', 'Player')}"
            if (project.rootProject.hasProperty('saomenu.preview')) {
                source sourceSets.dev
                mods {
                    saomenu {
                        sourceSet sourceSets.main
                        sourceSet sourceSets.dev
                    }
                }
            }
        }
        server {
            server()
            name "Forge Server"
            def configuredRunDir = project.rootProject.findProperty('saomenu.runDir')
            runDir(configuredRunDir == null
                    ? "run/server" : project.relativePath(project.rootProject.file(configuredRunDir)))
            vmArgs "-Dneoforge.enabledGameTestNamespace=saomenu"
            if (project.rootProject.findProperty('saomenu.preview.multiplayer') == 'server') {
                if (!project.rootProject.hasProperty('saomenu.preview') || configuredRunDir == null) {
                    throw new GradleException('Multiplayer verification requires explicit evidence and isolated run directories')
                }
                source sourceSets.dev
                mods {
                    saomenu {
                        sourceSet sourceSets.main
                        sourceSet sourceSets.dev
                    }
                }
            }
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it conflicts with Loom.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
    
    // 排除不需要的文件
    exclude 'META-INF/versions/**'
    
    // 强制更新 META-INF/services 里的类名
    mergeServiceFiles()
    
    // 排除 module-info.class 避免 JPMS 冲突
    exclude 'module-info.class'
}


remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}

jar {
	archiveClassifier.set("dev")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	
	manifest {
		attributes([
			'Specification-Title'     : 'SAO Menu',
			'Specification-Vendor'    : 'SAO-World',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'SAO-World'
		])
	}
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.shedaniel.me/"
        name "Shedaniel Maven"
    }
    maven {
        url "https://maven.minecraftforge.net/"
        name "Forge"
    }
    maven {
        url "https://maven.architectury.dev/"
        name "Architectury"
    }
    maven {
        url "https://cursemaven.com"
        name "CurseMaven"
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'saomenu',
        mod_name: 'SAO Menu',
        mod_version: project.version,
        mod_authors: 'SAO Menu Team',
        mod_description: 'SAO Utils style circular menu for Minecraft 1.20.1'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

dependencies {
    // Common 模块 - 添加源代码到编译路径
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive false }

    // Forge 平台
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Architectury API - 使用 Jar-in-Jar 内嵌
    modApi("dev.architectury:architectury-forge:9.2.14")
    include("dev.architectury:architectury-forge:9.2.14")

    // Load an independently built addon for API verification without adding its sources to this mod.
    if (rootProject.hasProperty('saomenu.addonJar')) {
        def addon = rootProject.file(rootProject.property('saomenu.addonJar'))
        if (!addon.isFile()) {
            throw new GradleException("Addon JAR does not exist: ${addon}")
        }
        // Loom's dependency remapper reads hierarchy only from mod configurations.
        // The release API is analysis/compile-only here: never load a second SAOMenu at runtime.
        def apiJar = file("build/libs/saomenu-forge-${project.version}.jar")
        if (!apiJar.isFile()) {
            throw new GradleException("Build :forge:build before verifying a binary addon.")
        }
        modCompileOnly files(apiJar)
        modRuntimeOnly files(addon)
    }
}

// Source JAR 组装（合并 common 源码）
sourcesJar {
    // Avoid duplicate entries when merging common sources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

sourceSets {
    main {
        java {
            // Avoid JPMS split-package: keep top-level network package only in common
        }
        resources {
            exclude 'assets/saomenu/lang/*.json'
        }
    }
}

tasks.register('apiJavadoc', Javadoc) {
    dependsOn classes, project(':common').tasks.named('classes')
    source project(':common').fileTree('src/main/java') { include 'com/sao/saomenu/api/**/*.java' }
    source sourceSets.main.allJava.matching { include 'com/sao/saomenu/api/**/*.java' }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/api').get().asFile
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.windowTitle = 'SAOMenu Client UI API'
    javadocTool = javaToolchains.javadocToolFor { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.register('apiJavadocJar', Jar) {
    dependsOn tasks.named('apiJavadoc')
    archiveClassifier = 'api-javadoc'
    from tasks.named('apiJavadoc').map { it.destinationDir }
}
